name: Desktop Windows Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: desktop/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Test
        run: go test ./...

      - name: Build portable exe
        run: wails build -platform windows/amd64 -clean -nopackage -o CodexMobileGateway.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobileGateway-windows-amd64
          path: desktop/build/bin/CodexMobileGateway.exe
          if-no-files-found: error
