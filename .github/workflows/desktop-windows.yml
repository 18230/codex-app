name: Desktop Windows Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  windows-portable:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: desktop/go.sum

      - name: Setup Node for frontend build
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.82

      - name: Generate bindings and build frontend
        run: wails3 task common:build:frontend

      - name: Test
        run: go test ./...

      - name: Build portable exe
        run: wails3 task windows:build ARCH=amd64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexMobileGateway-windows-amd64
          path: desktop/bin/CodexMobileGateway.exe
          if-no-files-found: error
